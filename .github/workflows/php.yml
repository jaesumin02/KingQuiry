name: PHP checks

on:
  push:
  pull_request:

jobs:
  lint-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: fileinfo, mysqli
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run production baseline checks
        run: php tests/production_baseline_test.php
